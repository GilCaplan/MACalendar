# Lint rules for the whole repo (python-clean-code standard, rule 12).
# Run `ruff check .` before committing; `ruff check --fix .` applies the safe fixes.
# Formatting is NOT enforced here: reformatting every file at once would bury
# real changes in a one-off diff. Format the files you touch.

line-length = 120
target-version = "py311"
extend-exclude = [
    "retired",      # superseded brains, kept verbatim for comparison (CLAUDE.md)
    ".venv",
]

[lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    # Scripts and tests set their scratch environment BEFORE importing
    # `assistant`, because the stores read their paths at import time
    # (CLAUDE.md "Personal data lives outside the repo"). That ordering is
    # the point, so an import below code is deliberate.
    "E402",
]

[lint.isort]
known-first-party = ["assistant", "scripts", "tests"]
