hotkey:
  modifiers: ["cmd", "shift"]
  key: "space"

# "whisper" = free, local, runs on your Mac (no internet needed)
# "google"  = free tier, requires internet
stt_engine: "whisper"    # "mlx" = Whisper on Apple GPU via mlx-whisper (fastest on M-series)

whisper:
  model_size: "base"       # tiny | base | small | medium | large-v3
  compute_type: "int8"     # int8 is fastest on Apple Silicon
  device: "cpu"            # cpu recommended (CTranslate2 int8 is very fast on M-series)
  language: "en"           # null = auto-detect

mlx_whisper:
  model: "mlx-community/whisper-base-mlx"
  language: "en"

google_stt:
  api_key: null            # null = free tier (no key needed)

# "ollama" = free, local (default)
# "openai" = requires API key (GPT-4o)
# "gemini" = requires API key (Gemini 1.5 Pro)
# "claude" = requires API key (Claude 3.5 Sonnet)
llm_engine: "ollama"

ollama:
  keep_alive: -1           # keep the model loaded between commands (-1 = forever, or "30m")
  warm_up: true            # preload the model at startup so the first command is fast
  verify_model: null       # stronger/slower model for the background self-check (null = same as model)
  base_url: "http://localhost:11434"
  model: "llama3.1:8b"
  temperature: 0.1
  timeout_seconds: 180

openai:
  api_key: null
  model: "gpt-4o"
  temperature: 0.1

gemini:
  api_key: null
  model: "gemini-1.5-pro"
  temperature: 0.1

claude:
  api_key: null
  model: "claude-3-5-sonnet-20240620"
  temperature: 0.1

# ...

# 0 = fully autonomous (no confirmation dialogs)
# 1 = simple yes/no before each action
confirmation_level: 1

# Background LLM re-check of every fast-path result. Runs on a daemon thread
# after the record is already written, so it costs the user no latency.
#
# It was off because it proposed a correction on ~96% of commands and fixed
# none. The cause was that it judged the rule parser's raw slots instead of the
# validated intent: every create_event carries end_time="" before defaults are
# applied, so the verifier dutifully "fixed" an end time that was already
# right. It now sees what actually reached the database, and the same
# measurement gives 0 corrections on 10 correct fast-path commands while still
# catching 3 of 3 confidently-wrong parses.
#
# The verdict only decides *whether* to change something. The replacement is
# written by the full parser, and if the parser agrees with what already ran
# the verdict is discarded — the verifier is a good detector and an unreliable
# author. Set false to go back to trusting the rules unchecked.
verify_fast_path: true

# Should the self-check WRITE its corrections, or only report them?
#
# Measured, not guessed. Audit of 2026-09-02, 89 commands, after the raw-slots
# fix and the parser-authored corrections:
#
#     quick answer   97% correct
#     once settled   96% correct      <-- applying made it worse
#     self-check ran on 85, proposed 38, applied 29
#     fixed by self-check: 0    broken by self-check: 1
#
# Zero fixed is the number that matters. The one break shows why: "meeting
# tomorrow at 2 sorry not 2, 3 pm with Adin" was parsed correctly as 3 pm, and
# the self-check moved it back to 2 pm. The guard that only accepts a time
# actually spoken in the command did not help — "2" was spoken, in the half of
# the sentence the speaker retracted.
#
# So it stays advisory: it still runs on every command, still reasons, still
# shows its verdict in the thinking panel, and the escalation path still
# rewrites genuinely wrong actions at execution time. It just does not get to
# silently edit a record it cannot reliably improve. Set true to let it write.
self_check_apply: false

audio:
  sample_rate: 16000
  silence_threshold: 0.01      # RMS below this = silence
  silence_duration_sec: 20.0   # stop after 20s of silence (or use 'execute' stop word)
  max_recording_sec: 120       # hard cap
  # Redo / Add more / Send bar after recording (matches the iPhone).
  # A spoken stop word ("execute", "done", …) always sends straight away.
  review_before_send: true
  review_seconds: 3

tts:
  mute: false          # set to true to disable voice output
  voice: "Samantha"    # run `say -v ?` to list all available voices
  rate: 200            # words per minute

# iPhone API server settings
api:
  key: null            # optional secret — set a string to require X-API-Key header on all requests
                       # recommended when using --tailscale or --lan
  port: 8080           # where the phone API listens; the thinking HUD uses this to reach it

# Hebrew calendar + Jewish/Israeli holidays (all computed offline via pyluach)
# Workout scheduling around Shabbat and the chagim (assistant/observance.py).
# Sundown is computed locally with `astral` — no network calls.
observance:
  enabled: true                  # Shabbat/yom tov/fast gating (engine gate +
                                 # recurring-series skip). false switches all
                                 # of it off; MACALENDAR_OBSERVANCE=0 overrides
                                 # (the dataset replay harness sets that).
  latitude: 31.7683              # Jerusalem
  longitude: 35.2137
  timezone: "Asia/Jerusalem"
  city: "Jerusalem"
  tzeit_depression: 8.5          # nightfall; 8.5 deg = common Israeli practice
  candle_lighting_minutes: 18
  erev_buffer_minutes: 90        # finish this long before candle lighting
  motzei_buffer_minutes: 30      # wait this long after nightfall
  earliest_hour: 5
  latest_evening: "22:30"
  minor_fast_is_rest_day: true   # Tzom Gedalia etc. = full rest, not a late run
  allow_motzei_fallback: true    # Saturday night only to save a lost session

notifications:
  enabled: true                # master switch for everything below
  daily_digest: true           # THE DAY PANEL: one summary of today's events + tasks
  digest_time: "07:00"         # local, HH:MM - when the day panel arrives
  agenda_card: true            # iPhone lock-screen agenda card (Live Activity). Clearing it on the phone hides it until 6am
  pre_event: false             # banners N min before something starts (replaced by the panel)
  default_lead_minutes: 0      # pre_event only. 0 = opt-in; N = N min before everything
  category_leads: {}           # pre_event only. e.g. {Work: 15, Errands: 0} - 0 MUTES that category
  respect_observance: true     # hold the panel/reminders through Shabbat & yom tov
  catch_up_minutes: 10         # Mac: fire late if missed by <= this
  sound: true
  speak: false                 # Mac only: also read it aloud

hebrew_calendar:
  display_mode: "both"      # "english" | "hebrew" | "both" — Hebrew dates use gematria letters, never numerals
  show_holidays: true        # overlay Jewish/Israeli holidays on Month/Week/Day views
  israel_holidays: true      # true = Israel schedule (1-day Yom Tov), false = Diaspora (2-day)

theme: "dark"  # "light" | "dark" - default theme on startup

ui:
  font_month: 11
  font_week: 11
  font_day: 13
  font_tasks: 13
  font_coursework: 13
  compact_ui: false
  show_week_numbers: true   # ISO week number column in the month grid
  accent_color: "#f5a524"   # hex; brand accent used app-wide (also editable from Settings → Accent Color)
  show_thinking: true       # show the assistant's stage-by-stage thinking HUD while a command runs.
                            # The HUD is a separate always-on-top app (assistant.thinking_hud),
                            # started by Launch Calendar.command; it re-reads this while running.
  thinking_corner: "bottom-right"   # which screen corner it parks in until you drag it:
                            # bottom-right | bottom-left | top-right | top-left


todo:
  sync:
    mode: "off"               # "today" | "general" | "off" — pull calendar events into the task list
    auto_sync_on_open: false
  show_completed: false       # show completed tasks in the list
  default_list: "today"       # which list new voice-created tasks go to by default
  auto_tag: ""                # "tag mode": every new task gets this tag (e.g. "Groceries"); "" = off
  auto_tag_infer: true        # with no tag said and tag mode off, infer one from the title
                              # ("buy chicken" → Groceries); only existing tags are used
  duplicate_window_seconds: 120  # second net under client_token, for callers that send no token:
                              # a POST /todos repeating a task that is already open, spelled the
                              # same, in the same list, and this new, returns the existing row
                              # instead of a second copy. 0 = off

nlu:
  event_keywords: [meeting, appointment, activity]
  memory_enabled: true     # remember every command + outcome in ~/.assistant_tools/nlu_memory.db
  memory_examples: 0       # few-shot: inject the k most similar past commands into the LLM prompt (0 = off;
                           # run 7 measured no effect at k=4, so the engine ships with it off — rows 74/76 revisit)

# The engine — the 7-step brain (DOCUMENTATION/ENGINE.md)
engine:
  confirm_transcript: false  # step 1: doubted words block execution behind an "edit the
                             # transcription" round-trip (clients that support it only)
  confirm_create: true       # step 4: "should I add yoga tomorrow?" is offered for
                             # confirmation, never executed or dropped silently
                             # (clients that support it only)
  reconcile: always          # step 6 on the fast track: always | uncertain (decided by telemetry)
  fast_track: true           # false = every command takes the foreground deep track
  kind_router: true          # event or to-do when NO rule decided: a small sklearn model
                             # (decompose_validate/kind_router.py); false = the tagger's
                             # catch-all "event" stands. Rules always win where one fired.
  coalesce_max_tokens: 300   # step 0: queued commands coalesced into one input up to this budget
  max_event_hours: 4.0       # a create_event the engine itself builds longer than this gets its
                             # end_time clipped back; never applied to a manual GUI edit
  quiet_hours_start: "23:00" # a start/end time the engine builds inside this window (spoken or
  quiet_hours_end: "06:00"   # defaulted) is FLAGGED in the reply, never silently changed

# Learned labellers (engine/label/). OFF by default: a model deciding an event's
# category changes what lands on your calendar, so it ships behind a flag with
# the keyword rules as the default — the same caution `self_check_apply` has.
#
# They STACK behind the rules rather than replacing them: the rules answer first
# and keep their measured 91.7% precision, and a model only fills a row they had
# no opinion about. Train with `python -m assistant.engine.label.train`.
labels:
  model_event: false     # learned event-category classifier
  model_task: false      # learned task-tag classifier
  model_first: false     # true: a confident model answer wins over the keyword rules; the
                         # rules answer only where the model abstains (Gil, 2026-09-22)

# Jude — the Judaic study assistant (assistant/jude/ARCHITECTURE.md)
#
# An INTEGRATION: an external app this assistant hosts, gates and proxies
# without vendoring or editing it. See assistant/integrations/CONVENTION.md for
# how to add another one.
#
# Jude is its OWN repository, not vendored into this one: it carries a ~1.2 GB
# corpus and a ~2 GB vector index and is still being worked on separately.
# Clone it and point `path` at it:
#
#     git clone https://github.com/GilCaplan/JudeTheJudaicChatBot
#
# Its model calls then go through this project's protocol — local Ollama only,
# the same model the assistant has already loaded, arbitrated by
# assistant/model_protocol.py — and the phone reaches it through this API on
# 8080, exactly like every other feature.
jude:
  enabled: false                   # true once the checkout is in place
  path: "../JudeTheJudaicChatBot"  # relative to this repo, or absolute; ~ is expanded
  port: 8000                       # where Jude's own server listens (localhost only)
  autostart: true                  # start it with the assistant; false = you run it yourself
  model: ""                        # "" = share `ollama.model`, so one model is loaded, not two
  allow_cloud: false               # true hands Jude back its own .env and its cloud cascade.
                                   # Left false, nothing here touches the internet.
  gate_port: 11435                 # the arbitrating ollama proxy Jude is pointed at, so its
                                   # calls queue with everything else. NOT ollama's own port.
  priority: background             # background = Jude YIELDS the model to your voice commands.
                                   # "live" makes it race them instead — see ollama_gate.py.
