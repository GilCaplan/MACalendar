name: Tests

# Re-enabled 2026-09-11, with the two things that were actually broken fixed.
#
# It was paused 2026-09-09 for the engine rebuild, and NOT because tests were
# failing: the last two runs died in "Install native libs", before pytest was
# ever reached, on `apt-get update` choking on the Chrome apt repo the runner
# image ships and this project neither needs nor installs:
#
#     E: Failed to fetch .../chrome-stable/deb/... Hash Sum mismatch
#
# That repo is dropped below rather than tolerated, so an unrelated third-party
# list can no longer fail this build.
#
# The second fix is `wamerican`. `assistant/stt/vocab.py` reads
# /usr/share/dict/words to stop a phonetic match rewriting a real English word,
# and a stock runner has no such file — where the list is empty the guard is
# OFF, so without this the suite would be testing a degraded vocabulary and
# skipping the test that says so.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install native libs (PortAudio, EGL/xcb for PyQt6, word list)
        run: |
          # The runner image ships third-party apt lists this project never
          # uses; one of them failing must not fail the build.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev wamerican \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Config
        # config.yaml is gitignored; the suite needs one to exist.
        run: cp config.example.yaml config.yaml

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        # Integration tests skip without Ollama, which CI has none of.
        run: python -m pytest tests/ -v

      # The CLI is the infrastructure health harness, and until now CI never
      # ran it — only the unit tests that inspect it. Those check the stage
      # LIST; this checks the command actually executes end to end: imports
      # resolve in a clean interpreter, the console-script entry point is
      # wired, and no layer raises.
      #
      # `doctor` is NOT expected to be green here and never will be: it exits
      # non-zero when any layer is ✘, and CI has no Ollama, no HUD heartbeat
      # and no GUI heartbeat, so llm/panel/macos are correctly red. What must
      # hold is that it RUNS — a traceback is a real failure, a red layer is
      # the honest answer. Asserting green would mean weakening the harness
      # until it agreed with an empty machine.
      - name: CLI — the layers that do not need a running stack
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          python -m assistant.cli check engine
          python -m assistant.cli check storage
          python -m assistant.cli endpoints > /dev/null
          assistant-cli endpoints > /dev/null   # the console-script entry point
          # NB `assistant` is the GUI (assistant.main:main); the CLI is
          # `assistant-cli`. Running the wrong one here would launch Qt.

      - name: CLI — doctor runs without raising (red layers are expected)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -uo pipefail
          out=$(python -m assistant.cli doctor 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "Traceback"; then
            echo "::error::assistant doctor raised — a layer crashed rather than reporting red"
            exit 1
          fi
