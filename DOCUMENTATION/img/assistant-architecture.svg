<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" style="color:#e6e4dd;background:#15171c;font-family:IBM Plex Sans,Helvetica,Arial,sans-serif" role="img" aria-label="How MACalendar answers a command. The iPhone and iPad turn speech into text on the device and the Mac uses Whisper; both send text to one brain on the Mac, the API server. Ingest repairs the words. A rules-only front door saves a clear single ask at once, and the judge re-checks it behind. Everything else goes down the deep track: segmentation cuts it into asks, decompose-validate settles event or to-do and resolves dates, times and repeats, FastRule builds one object per item with no model, and the judge checks every field against your words in code, using the language model only to read what the rules could not, and rewording a failed ask at most three times. Commit is the only write: it labels, looks on the other list when a change finds nothing, and saves what is ready before the model runs. All models run on the Mac behind a gate that serves live commands first; Shabbat and yom tov are computed from sundown at your location. Data lives in one SQLite file and a command memory; Google and Outlook calendars are an opt-in two-way sync. Below, how it improves: your reviews and corrections become gold, every change is measured alone on boards and your real commands, and kept or reverted.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#15171c"/>
  <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-opacity=".8">
    <text x="20" y="28" text-anchor="start" fill="currentColor" stroke="none" opacity=".6" font-size="11" font-weight="600" letter-spacing="1.5">HOW A COMMAND IS ANSWERED</text>
    <line x1="20" y1="38" x2="1180" y2="38" stroke-dasharray="2 4" opacity=".5"/>
    <text x="20" y="628" text-anchor="start" fill="currentColor" stroke="none" opacity=".6" font-size="11" font-weight="600" letter-spacing="1.5">HOW IT GETS BETTER</text>
    <line x1="20" y1="638" x2="1180" y2="638" stroke-dasharray="2 4" opacity=".5"/>
    <text x="95" y="62" text-anchor="middle" fill="currentColor" stroke="none" opacity=".55" font-size="10" font-weight="600" letter-spacing="1.2">THE SURFACES</text>
    <rect x="20" y="72" width="150" height="92" rx="6"/>
    <text x="95.0" y="92" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">iPhone &amp; iPad</text>
    <text x="95.0" y="108" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">speech → text on the device</text>
    <text x="95.0" y="122" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">lock-screen card · review</text>
    <text x="95.0" y="136" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">works offline, syncs later</text>
    <rect x="20" y="180" width="150" height="78" rx="6"/>
    <text x="95.0" y="200" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Mac calendar window</text>
    <text x="95.0" y="216" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">Whisper on the GPU</text>
    <text x="95.0" y="230" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">hotkey · Brief Me</text>
    <rect x="20" y="274" width="150" height="78" rx="6" stroke="#b48aef"/>
    <text x="95.0" y="294" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Thinking HUD</text>
    <text x="95.0" y="310" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">floats over any app</text>
    <text x="95.0" y="324" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">reads trace_bus.jsonl</text>
    <line x1="170" y1="118" x2="238" y2="160" marker-end="url(#ar)"/>
    <text x="205" y="128" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7" font-size="10" font-weight="400" letter-spacing="0">text</text>
    <line x1="170" y1="219" x2="238" y2="196" marker-end="url(#ar)"/>
    <path d="M 238 330 L 170 316" fill="none" stroke="#b48aef" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="206" y="342" text-anchor="middle" fill="#b48aef" stroke="none" opacity=".85" font-size="10" font-weight="400" letter-spacing="0">every step</text>
    <rect x="232" y="50" width="948" height="410" rx="10" stroke-opacity=".55" stroke-dasharray="6 4"/>
    <text x="706" y="70" text-anchor="middle" fill="currentColor" stroke="none" opacity=".75" font-size="11" font-weight="600" letter-spacing="0">assistant.api — THE BRAIN, on the Mac · one process, every surface is a client, source is only a label</text>
    <rect x="248" y="150" width="120" height="110" rx="6" stroke="#b48aef"/>
    <text x="308.0" y="170" text-anchor="middle" fill="#b48aef" stroke="none" font-weight="600" font-size="12.5">1 · Ingest</text>
    <text x="308.0" y="186" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">stop words, fillers,</text>
    <text x="308.0" y="200" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">misheard command</text>
    <text x="308.0" y="214" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">words, your own</text>
    <text x="308.0" y="228" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">vocabulary</text>
    <line x1="368" y1="168" x2="420" y2="120" stroke="#f5a524" marker-end="url(#ar)"/>
    <rect x="420" y="88" width="300" height="62" rx="6" stroke="#f5a524"/>
    <text x="570.0" y="108" text-anchor="middle" fill="#f5a524" stroke="none" font-weight="600" font-size="12.5">FastRule front door</text>
    <text x="570.0" y="124" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">the whole command, rules only · about 50 ms</text>
    <text x="570.0" y="138" text-anchor="middle" fill="#f5a524" stroke="none" font-size="10.5">sure of one clear ask? save it now</text>
    <line x1="720" y1="119" x2="1010" y2="119" stroke="#f5a524" marker-end="url(#ar)"/>
    <text x="866" y="111" text-anchor="middle" fill="#f5a524" stroke="none" opacity=".9" font-size="10" font-weight="400" letter-spacing="0">fast track</text>
    <path d="M 640 150 C 660 178, 880 172, 905 194" fill="none" stroke="#f5a524" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="632" y="176" text-anchor="end" fill="#f5a524" stroke="none" opacity=".9" font-size="9.5" font-weight="400" letter-spacing="0">the judge re-checks it behind</text>
    <line x1="368" y1="232" x2="400" y2="232" marker-end="url(#ar)"/>
    <rect x="400" y="196" width="122" height="92" rx="6"/>
    <text x="461.0" y="216" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">2 · Segmentation</text>
    <text x="461.0" y="232" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">cut into asks</text>
    <text x="461.0" y="246" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">give each its time</text>
    <text x="461.0" y="260" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">tag event · to-do</text>
    <line x1="522" y1="242" x2="540" y2="242" marker-end="url(#ar)"/>
    <rect x="540" y="196" width="138" height="92" rx="6"/>
    <text x="609.0" y="216" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">3 · decompose_validate</text>
    <text x="609.0" y="232" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">event or to-do:</text>
    <text x="609.0" y="246" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">rules, else a small model</text>
    <text x="609.0" y="260" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">dates · times · repeats</text>
    <line x1="678" y1="242" x2="696" y2="242" marker-end="url(#ar)"/>
    <rect x="696" y="196" width="122" height="92" rx="6"/>
    <text x="757.0" y="216" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">4 · FastRule</text>
    <text x="757.0" y="232" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">one item →</text>
    <text x="757.0" y="246" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">one object</text>
    <text x="757.0" y="260" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">no model</text>
    <line x1="818" y1="242" x2="836" y2="242" marker-end="url(#ar)"/>
    <rect x="836" y="196" width="150" height="92" rx="6" stroke="#6aa8ff"/>
    <text x="911.0" y="216" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">5 · LLMJudge</text>
    <text x="911.0" y="232" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">every field checked</text>
    <text x="911.0" y="246" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">against your words, in code</text>
    <text x="911.0" y="260" text-anchor="middle" fill="#6aa8ff" stroke="none" font-size="10.5">the model reads only what</text>
    <text x="911.0" y="274" text-anchor="middle" fill="#6aa8ff" stroke="none" font-size="10.5">the rules could not</text>
    <line x1="986" y1="242" x2="1010" y2="242" stroke="#6ec07a" marker-end="url(#ar)"/>
    <rect x="1010" y="88" width="158" height="200" rx="6" stroke="#6ec07a"/>
    <text x="1089.0" y="108" text-anchor="middle" fill="#6ec07a" stroke="none" font-weight="600" font-size="12.5">6 · Commit + label</text>
    <text x="1089.0" y="124" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">the only write</text>
    <text x="1089.0" y="138" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">category · to-do tags</text>
    <text x="1089.0" y="152" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">a change that finds</text>
    <text x="1089.0" y="166" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">nothing looks on</text>
    <text x="1089.0" y="180" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">the other list</text>
    <text x="1089.0" y="194" text-anchor="middle" fill="#6ec07a" stroke="none" font-size="10.5">saves what is ready</text>
    <text x="1089.0" y="208" text-anchor="middle" fill="#6ec07a" stroke="none" font-size="10.5">before the model runs</text>
    <path d="M 911 288 C 911 318, 461 318, 461 292" fill="none" stroke="#6aa8ff" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="686" y="316" text-anchor="middle" fill="#6aa8ff" stroke="none" opacity=".9" font-size="10" font-weight="400" letter-spacing="0">a subject you never said → reworded and re-parsed, at most three times</text>
    <rect x="248" y="342" width="300" height="98" rx="6"/>
    <text x="398.0" y="362" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Models — all on this Mac</text>
    <text x="398.0" y="378" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">Whisper · spaCy · Llama 3.1 8B (Ollama)</text>
    <text x="398.0" y="392" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">nomic-embed-text for labels</text>
    <text x="398.0" y="406" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">small classifiers: one ask or several,</text>
    <text x="398.0" y="420" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">event or to-do, operation</text>
    <rect x="560" y="342" width="210" height="98" rx="6"/>
    <text x="665.0" y="362" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Model gate</text>
    <text x="665.0" y="378" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">live commands go first;</text>
    <text x="665.0" y="392" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">tests and measurements</text>
    <text x="665.0" y="406" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">wait until you are quiet</text>
    <rect x="782" y="342" width="240" height="98" rx="6"/>
    <text x="902.0" y="362" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Shabbat &amp; yom tov</text>
    <text x="902.0" y="378" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">from sundown at your location;</text>
    <text x="902.0" y="392" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">a repeating event skips them;</text>
    <text x="902.0" y="406" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">yellow lines at the exact minute</text>
    <rect x="232" y="478" width="300" height="120" rx="6" stroke="#b48aef"/>
    <text x="382.0" y="498" text-anchor="middle" fill="#b48aef" stroke="none" font-weight="600" font-size="12.5">Command memory</text>
    <text x="382.0" y="514" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">every command, what it did,</text>
    <text x="382.0" y="528" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">and your verdict on it</text>
    <text x="382.0" y="542" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">nothing is sent anywhere</text>
    <rect x="548" y="478" width="300" height="120" rx="6" stroke-dasharray="4 3"/>
    <text x="698.0" y="498" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Connected calendars · opt-in</text>
    <text x="698.0" y="514" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">Google and Outlook two-way,</text>
    <text x="698.0" y="528" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">read-only links (Gmail, iCloud)</text>
    <text x="698.0" y="542" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">synced by the brain every 15 minutes,</text>
    <text x="698.0" y="556" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">window open or not</text>
    <rect x="880" y="478" width="300" height="120" rx="6" stroke="#6ec07a"/>
    <text x="1030.0" y="498" text-anchor="middle" fill="#6ec07a" stroke="none" font-weight="600" font-size="12.5">calendar.db · SQLite</text>
    <text x="1030.0" y="514" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">events, to-dos, linked series</text>
    <text x="1030.0" y="528" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">one file in ~/.assistant_tools</text>
    <text x="1030.0" y="542" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">no account, no cloud</text>
    <line x1="1095" y1="288" x2="1095" y2="478" stroke="#6ec07a" marker-end="url(#ar)"/>
    <line x1="848" y1="538" x2="880" y2="538" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="864" y="530" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7" font-size="9.5" font-weight="400" letter-spacing="0">sync</text>
    <rect x="20" y="660" width="220" height="88" rx="6" stroke="#b48aef"/>
    <text x="130.0" y="680" text-anchor="middle" fill="#b48aef" stroke="none" font-weight="600" font-size="12.5">You review a command</text>
    <text x="130.0" y="696" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">Right · Wrong · Fix every object,</text>
    <text x="130.0" y="710" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">or "nothing should have</text>
    <text x="130.0" y="724" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">been done"</text>
    <line x1="240" y1="704" x2="290" y2="704" stroke="#b48aef" marker-end="url(#ar)"/>
    <rect x="290" y="660" width="220" height="88" rx="6" stroke="#b48aef"/>
    <text x="400.0" y="680" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">… or just correct it</text>
    <text x="400.0" y="696" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">editing or deleting what it</text>
    <text x="400.0" y="710" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">made counts too; a misheard</text>
    <text x="400.0" y="724" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">word teaches the vocabulary</text>
    <line x1="510" y1="704" x2="560" y2="704" stroke="#b48aef" marker-end="url(#ar)"/>
    <rect x="560" y="660" width="250" height="88" rx="6"/>
    <text x="685.0" y="680" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">Measured, never guessed</text>
    <text x="685.0" y="696" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">a 1,200-command whole-chain board,</text>
    <text x="685.0" y="710" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">one board per stage, and your</text>
    <text x="685.0" y="724" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">real commands as the final check</text>
    <line x1="810" y1="704" x2="860" y2="704" stroke="#b48aef" marker-end="url(#ar)"/>
    <rect x="860" y="660" width="320" height="88" rx="6"/>
    <text x="1020.0" y="680" text-anchor="middle" fill="currentColor" stroke="none" font-weight="600" font-size="12.5">One change at a time</text>
    <text x="1020.0" y="696" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">predict what it will move, make it,</text>
    <text x="1020.0" y="710" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">measure it alone; keep it or revert it —</text>
    <text x="1020.0" y="724" text-anchor="middle" fill="currentColor" stroke="none" opacity=".68" font-size="10.5">the rulings you give are the gold</text>
    <path d="M 382 598 C 382 630, 600 630, 640 660" fill="none" stroke="#b48aef" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <path d="M 1020 660 C 1020 628, 1192 630, 1192 330" fill="none" stroke="#b48aef" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="1150" y="622" text-anchor="middle" fill="#b48aef" stroke="none" opacity=".85" font-size="9.5" font-weight="400" letter-spacing="0">back into the engine</text>
    <text x="1120" y="790" text-anchor="end" fill="currentColor" stroke="none" opacity=".5" font-size="9.5" font-weight="400" letter-spacing="0">diagram: DOCUMENTATION/img/assistant-architecture.svg · engine map: assistant/engine/ARCHITECTURE.md</text>
  </g>
</svg>
