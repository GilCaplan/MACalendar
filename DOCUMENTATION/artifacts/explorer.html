<html data-theme="dark">
<meta charset="utf-8">
<title>The Engine — Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #e8ebee;
    --panel: #f6f7f8;
    --screen: #eef1f3;
    --ink: #1b222b;
    --muted: #5b6673;
    --line: #b9c2cc;
    --faint: #d6dce2;
    --amber: #8f6407;
    --amber-soft: rgba(158, 113, 10, .10);
    --model: #116e83;
    --good: #20714a;
    --codebg: #dfe3e8;
    --shadow: rgba(20, 28, 38, .16);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f14;
      --panel: #141a22;
      --screen: #0f141b;
      --ink: #dde4eb;
      --muted: #8a96a3;
      --line: #33404f;
      --faint: #1c2530;
      --amber: #e3aa3d;
      --amber-soft: rgba(227, 170, 61, .09);
      --model: #5cc3d6;
      --good: #54b183;
      --codebg: #1a222d;
      --shadow: rgba(0, 0, 0, .55);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b0f14;
    --panel: #141a22;
    --screen: #0f141b;
    --ink: #dde4eb;
    --muted: #8a96a3;
    --line: #33404f;
    --faint: #1c2530;
    --amber: #e3aa3d;
    --amber-soft: rgba(227, 170, 61, .09);
    --model: #5cc3d6;
    --good: #54b183;
    --codebg: #1a222d;
    --shadow: rgba(0, 0, 0, .55);
  }

  * {
    box-sizing: border-box
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 'IBM Plex Mono', ui-monospace, monospace;
    margin: 0;
    padding: 0 0 40px 0;
  }

  header {
    max-width: 1360px;
    margin: 0 auto;
    padding: 34px 20px 8px;
  }

  .eyebrow {
    font: 500 11px/1 'IBM Plex Mono', monospace;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px;
  }

  h1 {
    font: 600 clamp(1.4rem, 4vw, 2.1rem)/1.15 'IBM Plex Mono', monospace;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .lede {
    max-width: 60ch;
    margin: 0 0 6px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .lede strong {
    color: var(--amber);
  }

  .stagewrap {
    /* 1120 scaled the 1000-unit viewBox to 1.10, so the drawings' own 8px
       labels landed at 8.8px on screen -- Gil: "some of the text seems a bit
       too small". Widening scales the whole drawing up together, which costs
       no layout risk at all; the prose below keeps its own 60ch measure. */
    max-width: 1400px;
    margin: 12px auto 0;
    padding: 0 12px;
    position: relative;
  }

  .canvas {
    position: relative;
    /* BOTH stages are position:absolute, so this box had NO height at all --
       measured 0px. The diagram overflowed an empty container, which put the
       hint line underneath the drawing and dropped the "back to System"
       button straight onto it. The ratio matches the system stage's viewBox
       (1000x560); setView swaps it for the engine's taller one. */
    aspect-ratio: 1000 / 560;
  }

  .canvas.is-engine {
    aspect-ratio: 1000 / 620;
  }

  svg.stage {
    width: 100%;
    height: auto;
    display: block;
    transition: opacity .3s;
    position: absolute;
    top: 0;
    left: 0;
  }
  svg.stage.off {
    opacity: 0;
    pointer-events: none;
    z-index: -1;
  }

  svg.stage text {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    fill: var(--ink);
    user-select: none;
  }

  /* The zoom. `open()` writes a transform onto .world; without a transition
     that landed as a hard cut, which reads as the page redrawing rather than
     as the reader moving in. Long enough to follow the motion, short enough
     not to wait for it -- and the reduced-motion block above drops it. */
  .world {
    transition: transform .48s cubic-bezier(.22, .61, .36, 1);
    will-change: transform;
  }

  /* Which box you are looking at. `.sel` was set and cleared by the script
     but had no styling at all, so a zoom arrived with nothing marked and the
     reader had to work out which of six boxes the panel was describing. */
  svg.stage .sel .frame {
    stroke: var(--amber) !important;
    stroke-width: 2.6 !important;
  }

  /* Everything else steps back, but only once something IS selected --
     several panels (the orchestrator, the shared readers) have no box of
     their own, and dimming all six for those looked like a broken page. */
  svg.stage.zoomed.hassel [data-stage]:not(.sel),
  svg.stage.zoomed.hassel [data-panel]:not(.sel) {
    opacity: .3;
  }

  /* clickable boxes */
  [data-stage] {
    cursor: pointer;
    outline: none;
    transition: opacity .3s, filter .3s;
  }

  [data-stage]:hover .frame {
    stroke: var(--amber) !important;
    stroke-width: 2.4 !important;
  }

  [data-stage]:focus-visible .frame {
    stroke: var(--amber) !important;
    stroke-width: 2.4 !important;
  }

  [data-stage]:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  /* arrow tooltips */
  .arrow-tooltip {
    position: absolute;
    z-index: 40;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 8px 28px var(--shadow);
    padding: 10px 14px;
    font: 400 11.5px/1.6 'IBM Plex Mono', monospace;
    color: var(--ink);
    /* 380px could not fit BESIDE a vertical arrow on this canvas -- every
       candidate placement overlapped a stage box, so the ranking below always
       had to settle for the least-bad one. 300 fits, which lets the tooltip
       sit clear of the diagram instead of on top of it. */
    max-width: 300px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
    white-space: pre-line;
  }

  .arrow-tooltip.show {
    opacity: 1;
  }

  .arrow-tooltip b {
    color: var(--amber);
    font-weight: 600;
    font-size: 12px;
  }

  .arrow-tooltip code {
    background: var(--codebg);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 11px;
  }

  .arrow-tooltip .tip-type {
    /* These three were written with margin-top, which does nothing on an
       inline element -- so the tooltip rendered as one run-on string
       ("X3items, completeevery field..."). They were always meant to stack. */
    display: block;
    color: var(--amber);
    font-weight: 500;
    margin-top: 2px;
  }

  .arrow-tooltip .tip-ex {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-style: italic;
    font-size: 10.5px;
  }

  .arrow-tooltip .tip-explain {
    display: block;
    margin-top: 3px;
  }

  /* fat hit area for arrows */
  .arrow-hit {
    stroke: transparent;
    stroke-width: 20;
    fill: none;
    cursor: help;
    pointer-events: stroke;
  }


  #devctl {
    position: absolute;
    top: 8px;
    right: 24px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 7px;
    font: 500 10.5px/1 'IBM Plex Mono', ui-monospace, monospace;
    letter-spacing: .14em;
    color: var(--muted);
  }

  #devctl[hidden] {
    display: none;
  }

  #devctl button {
    width: 26px;
    height: 26px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    font: 600 14px/1 'IBM Plex Mono', monospace;
    cursor: pointer;
  }

  #devctl button:hover:not(:disabled) {
    border-color: var(--amber);
    color: var(--amber);
  }

  #devctl button:disabled {
    opacity: .35;
    cursor: default;
  }

  #devctl output {
    min-width: 14px;
    text-align: center;
    color: var(--ink);
    font-weight: 600;
    font-size: 12px;
  }

  /* Top-level views */


  #btn-back-system:hover {
    border-color: var(--amber) !important;
    color: var(--amber) !important;
  }

  /* drill-down view */
  #drilldown {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
    animation: fadeUp .35s cubic-bezier(.22, .85, .3, 1);
    overflow-y: auto;
    padding-bottom: 40px;
  }

  #drilldown.open {
    display: block;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(16px);
    }

    to {
      opacity: 1;
      transform: none;
    }
  }

  #drill-header,
  #drill3-header {
    max-width: 1360px;
    margin: 0 auto;
    padding: 16px 20px 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #drill-back,
  #drill3-back {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: 500 13px/1 'IBM Plex Mono', monospace;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  #drill-back:hover,
  #drill3-back:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  #drill-title,
  #drill3-title {
    font: 600 18px/1.2 'IBM Plex Mono', monospace;
    letter-spacing: .04em;
  }

  #drill-subtitle,
  #drill3-subtitle {
    font: 400 12px/1.4 'IBM Plex Mono', monospace;
    color: var(--muted);
    margin-left: auto;
  }

  #drill-svg-wrap,
  #drill3-svg-wrap {
    max-width: 1400px;
    margin: 8px auto 0;
    padding: 0 12px;
  }

  #drill-svg-wrap svg,
  #drill3-svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  #drill-svg-wrap svg text {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    fill: var(--ink);
    user-select: none;
  }

  /* BLACK TEXT ON A DARK PANEL. The figures inside the detail panel had no
     fill rule of ANY kind, and SVG text with no fill defaults to black -- so
     unlabelled labels in five panel diagrams computed to rgb(0,0,0) against a
     near-black background. Measured, not guessed.

     The rule goes on the <svg>, NOT on `text`. `fill` is an inherited
     property, so this supplies a DEFAULT that each label's own fill attribute
     still overrides; a `text` selector would beat those presentation
     attributes and flatten every deliberate green and amber in the figures. */
  #pbody svg {
    fill: var(--ink);
  }

  /* inner boxes in drill-down (Layer 3 targets) */
  .inner-box {
    cursor: default;
  }

  .inner-box .frame {
    transition: stroke .2s;
  }

  [data-sub] {
    cursor: pointer;
    outline: none;
    transition: opacity .3s, filter .3s;
  }

  [data-sub]:hover .frame {
    stroke: var(--amber) !important;
    stroke-width: 1.8 !important;
  }

  [data-sub]:focus-visible .frame {
    stroke: var(--amber) !important;
    stroke-width: 1.8 !important;
  }

  [data-sub]:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  /* Layer 3 drill-down view (Floating Panel) */
  @keyframes popZoom {
    0% {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
    }

    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

      .panel-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 20px;
    border-bottom: 1px solid var(--line);
  }

  .panel-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 6px;
    flex-shrink: 0;
  }

  .panel-title-wrap {
    flex-grow: 1;
  }

  #drill3-subtitle {
    font: 600 11px/1.2 'IBM Plex Mono', monospace;
    letter-spacing: .08em;
    color: var(--muted);
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  #drill3-title {
    font: 600 20px/1.2 'IBM Plex Mono', monospace;
    color: var(--ink);
    display: block;
  }

  .panel-close {
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }

  .panel-close:hover {
    color: var(--ink);
    border-color: var(--muted);
  }

  #drill3-svg-wrap {
    padding: 24px;
    overflow-y: auto;
    flex-grow: 1;
    background: var(--bg);
  }

  #drill3-svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  #drill3-svg-wrap svg text {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    fill: var(--ink);
    user-select: none;
  }

  .panel-footer {
    display: flex;
    padding: 16px 20px;
    border-top: 1px solid var(--line);
    background: var(--screen);
  }

  #drill3-back {
    border: 1px solid var(--line);
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font: 500 14px/1 'IBM Plex Mono', monospace;
    padding: 8px 16px;
    cursor: pointer;
  }

  #drill3-back:hover {
    color: var(--ink);
    border-color: var(--muted);
  }

  /* nav hint */
  /* THE VIEW SWITCHER. `buildViews()` has always built a button per view, into
     a nav that was `display:none` with no rule of its own -- so two of the four
     views the page defines (the loop, the evaluation) and the 22 panels behind
     them were unreachable by any means. */
  #views {
    max-width: 1400px;
    margin: 14px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #views button {
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: 500 12px/1 'IBM Plex Mono', monospace;
    padding: 8px 14px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }

  #views button:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  #views button.on {
    border-color: var(--amber);
    background: var(--amber-soft);
    color: var(--amber);
  }

  .hint {
    max-width: 1360px;
    margin: 6px auto 0;
    padding: 0 20px;
    font: 400 11.5px/1.5 'IBM Plex Mono', monospace;
    color: var(--muted);
  }

  .hint kbd {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 0 4px;
    font-family: inherit;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }

  @media (max-width:760px) {
    #drill-header {
      flex-wrap: wrap;
    }

    #drill-subtitle {
      margin-left: 0;
      width: 100%;
    }
  }

  #panel {
    position: absolute;
    right: 20px;
    top: 20px;
    width: 340px;
    max-height: calc(100% - 40px);
    background: var(--screen);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 32px var(--shadow);
    z-index: 50;
    display: flex;
    flex-direction: column;
    animation: fadeUp .3s cubic-bezier(.22, .85, .3, 1);
  }

  #panel[hidden] {
    display: none;
  }

  .pbar {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pdot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
    background: var(--amber);
  }

  .ptt {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #ptag {
    font: 600 10px/1 'IBM Plex Mono', monospace;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-right: 8px;
  }

  #ptitle {
    font: 500 14px/1 'Inter', sans-serif;
    color: var(--ink);
  }

  #pclose {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--muted);
    font: 18px/1 sans-serif;
    cursor: pointer;
  }

  #pclose:hover {
    background: var(--panel);
    color: var(--ink);
  }

  #pback {
    display: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: 500 11.5px/1 'IBM Plex Mono', monospace;
    padding: 7px 12px;
    margin-right: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  #pback:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  #panel.full #pback {
    display: inline-block;
  }

  /* #pfull sits beside #pclose and had no rule of its own, so it inherited
     the browser's default button chrome next to a styled one. */
  #pfull {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    border: none;
    background: transparent;
    color: var(--muted);
    font: 13px/1 sans-serif;
    cursor: pointer;
    margin-right: 2px;
  }

  #pfull:hover {
    background: var(--panel);
    color: var(--amber);
  }

  /* THE STEP-THROUGH NAV had no styling at all -- three default buttons on a
     bare strip, in the sidebar as well as in full mode. It is the only way to
     walk the components in order, so it should look like a control. */
  .pnav {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-top: 1px solid var(--line);
  }

  .pnav button {
    flex: 1 1 auto;
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: 500 11.5px/1.2 'IBM Plex Mono', monospace;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .pnav button:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  .pnav #phome {
    flex: 0 0 auto;
    width: 34px;
    text-align: center;
  }

  #pbody {
    padding: 16px 14px;
    overflow-y: auto;
    font: 400 13px/1.55 'Inter', sans-serif;
    color: var(--ink);
  }

  #pbody p {
    margin: 0 0 12px;
  }

  #pbody strong {
    font-weight: 600;
  }

  #pbody ul {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  #pbody li {
    margin-bottom: 6px;
  }

  /* A <code> INSIDE A <pre> must not keep the INLINE code metrics. This rule
     sets line-height 1, which is right for a chip in a sentence and clips the
     ascenders off every line of a multi-line block -- the listings in the
     panel were rendering with their tops shaved off. */
  #pbody pre code {
    font: inherit;
    line-height: inherit;
    background: none;
    padding: 0;
  }

  #pbody code {
    font: 12px/1 'IBM Plex Mono', monospace;
    padding: 2px 4px;
    border-radius: 4px;
    background: var(--panel);
  }

  .figs {
    font: 500 11px/1.5 'IBM Plex Mono', monospace;
    color: var(--amber);
    margin-top: 16px !important;
  }

  .morebtn {
    display: block;
    width: 100%;
    padding: 8px;
    border: 1px solid var(--amber);
    border-radius: 6px;
    background: transparent;
    color: var(--amber);
    font: 500 12px/1 'IBM Plex Mono', monospace;
    cursor: pointer;
    margin-top: 16px;
    text-align: center;
  }

  .morebtn:hover {
    background: var(--amber-soft);
  }

  /* ---------------------------------------------------------------------
     A PAGE DEEPER, not a taller column.

     `showMore()` has always added `.full`, and `#pfull` has always toggled
     it -- but no rule for it was ever written, so "full detail" left the
     reader in the same 340px sidebar with a 380-wide diagram squeezed into
     it. The sub-component figures are the whole point of going deeper and
     they were the least readable thing on the page.

     Full mode is now a real page: it leaves the stage behind entirely,
     centres one column at a comfortable measure, and gives the figures room
     to be read.
     --------------------------------------------------------------------- */
  #panel.full {
    position: fixed;
    inset: 0;
    width: auto;
    max-width: none;
    max-height: none;
    border: 0;
    border-radius: 0;
    z-index: 60;
    background: var(--bg);
    animation: fadeUp .22s cubic-bezier(.22, .85, .3, 1);
  }

  #panel.full .pbar {
    position: sticky;
    top: 0;
    background: var(--screen);
    padding: 14px clamp(16px, 5vw, 48px);
    z-index: 2;
  }

  #panel.full #pbody {
    padding: 30px clamp(16px, 5vw, 48px) 64px;
    font-size: 15px;
    line-height: 1.7;
  }

  /* one column, at a measure that is actually comfortable to read */
  #panel.full #pbody > * {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }

  #panel.full .pnav {
    position: sticky;
    bottom: 0;
    background: var(--screen);
    justify-content: center;
    padding: 12px clamp(16px, 5vw, 48px);
  }

  #panel.full .pnav button {
    flex: 0 1 auto;
    max-width: 280px;
    font-size: 12.5px;
    padding: 8px 16px;
  }

  /* THE FIGURES. They carry a viewBox and no width, so without this they
     render at whatever the box happens to be -- which in the sidebar was
     unreadably small. */
  #pbody svg {
    display: block;
    width: 100%;
    height: auto;
    margin: 4px auto 10px;
  }

  /* A figure may run wider than the prose: text wants ~760px to stay
     readable, a diagram only gets clearer with room.

     The drill-in body is wrapped in .pmore, so the 760px measure above landed
     on the WRAPPER and every figure inside inherited it -- which is why the
     diagrams stayed at 760 however wide their own cap was. The wrapper now
     runs to the figure width, and the prose measure moves onto its children. */
  #panel.full #pbody svg {
    max-width: 900px;
  }

<script>
  const P = {
    /* ================= THE SYSTEM ================= */
    brain: {
      view: "system", tag: "the thesis", name: "the brain", rl: "◆ one brain", title: "One brain",
      z: [352, 256, 1.9],
      sum: `<p>One process understands and executes everything. The host's own window and every attached surface are thin clients &mdash; <strong>none of them contains a parser</strong>.</p>
    <p class="figs">15 actions · 9 of them reachable by rule alone · seventeen named rules · a test suite</p>`,
      more: `<h3>How one command becomes an answer</h3>
    <p>Read straight through for the story; the engine view has each component's own mechanics.</p>
    <ol>
      <li><strong>Arrival.</strong> A command arrives &mdash; typed, or a spoken transcript &mdash; from
      the Mac or the phone. A field called <code>source</code> is the whole difference between them.</li>
      <li><strong>Intake.</strong> The orchestrator takes a lock, so one command runs at a time; queued
      inputs can be merged into one batch first.</li>
      <li><strong>Repair the words.</strong> Stop words, false starts, spoken noise, then the personal
      vocabulary. A transcript with nothing in it is dropped and <em>not remembered</em>.</li>
      <li><strong>Choose a track.</strong> FastRule reads the whole command. If it commits, the answer is
      executed and returned immediately &mdash; no language-model call anywhere on that path &mdash; and the judge
      re-checks it in the background. If it defers, the deep track takes over, and FastRule's verdict and
      partial parse travel with it.</li>
      <li><strong>Atomize.</strong> The deep system splits the command into independent asks, then splits
      each of those into atomic pieces.</li>
      <li><strong>Read each piece.</strong> Every atomic piece goes back to FastRule first; the model is
      asked only about the pieces the rules could not read, grounded on that piece's own words.</li>
      <li><strong>Check the fields.</strong> Seventeen named rules run on the finished objects &mdash; and
      the observance gate, on what the assistant itself books.</li>
      <li><strong>Judge.</strong> Every field of every object is traced back to your words &mdash; the when
      in code, the subject by asking the model to quote it. What checks out commits; what names something
      you never said is reworded and re-parsed, at most three times.</li>
      <li><strong>Commit, label, answer</strong> &mdash; and remember the command with what it produced.</li>
    </ol>

    <h3>The fifteen actions</h3>
    <p>An action is one verb the assistant knows, and the list is closed. Adding a sixteenth means adding
    a directory, not editing the pipeline.</p>
    <table>
      <thead><tr><th>Domain</th><th>n</th><th>Verbs</th></tr></thead>
      <tbody>
        <tr><td>events</td><td class="num">4</td><td>create &#183; update &#183; delete &#183; ask what is on</td></tr>
        <tr><td>tasks</td><td class="num">8</td><td>the same four, plus the same four again for sub-tasks</td></tr>
        <tr><td>training</td><td class="num">2</td><td>write a routine &#183; place it on real dates</td></tr>
        <tr><td>clarify</td><td class="num">1</td><td>say it did not follow, instead of guessing</td></tr>
      </tbody>
    </table>
    <p>Eight of the fifteen actions are about tasks, because a task has a lifecycle &mdash; it can be
    completed, un-completed, and carry children that do the same &mdash; while an event either exists or
    does not. Nine of the fifteen are reachable by the rules alone; anything involving sub-tasks or
    training goes to the model, because the sentences that ask for them vary too much for a verb table.</p>`
    },
    hear: {
      view: "system", tag: "before the engine", name: "hear", rl: "hear", title: "It hears locally",
      z: [357, 485, 2.6],
      sum: `<p>Speech becomes text on the laptop's own GPU, from a model already on disk.</p>
    <p class="figs">Whisper base · 74M parameters · no network</p>`,
      more: `<p>Whisper runs from a file already on the disk. Nothing is uploaded, and it works with the
    network off.</p>
    <p>What comes back is not clean text. Dictation produces &ldquo;230PM&rdquo; with no colon, splits
    names into syllables, and turns unfamiliar words into familiar-sounding ones. Everything downstream is
    built for that rather than against it &mdash; which is why the first stage of the engine exists at
    all.</p>
    <p>Every word of the personal vocabulary is also handed to the speech model as a bias, nudging it to
    spell the word right in the first place. Correction is the fallback, not the plan.</p>`
    },
    models: {
      view: "system", tag: "on the laptop", name: "models", rl: "the models", title: "Three big, three small",
      z: [156, 238, 2.4],
      sum: `<p>Three models on this machine: one hears, one reads grammar, one understands. Two of the three load <em>inside</em> THE ASSISTANT; only the language model gets its own process.</p>
    <p class="figs">Whisper 74M · spaCy · Llama 3.1 8B, 5.8 GB resident</p>`,
      more: `<p>The drawing separates them because a reader once concluded the separate box held all three.
    It holds one. Whisper loads in the API process and spaCy in the rule parser &mdash; both inside the
    process that does the deciding &mdash; and the language model sits beside them in <strong>its own
    process</strong>, answering when asked.</p>
    <p>Four of the seven engine stages may call the language model, each with its own schema-constrained
    question: split this command, split this item's times, repair these garbled words, and list what the
    raw words asked for. The other three &mdash; the transcript stage, the FastRule stage and the label
    stage &mdash; never call it at all. FastRule stopped asking in the 2026-09-10 restructure: it converts
    an already-atomic item into an object with no model and no opinion about committing, and what it
    cannot build it hands to LLMJudge rather than asking a second time itself. Same weights, four
    different questions.</p>
    <h3>And three small ones you would not call models</h3>
    <p>Three logistic classifiers ride inside the fast path: <em>is this one item or several</em>, <em>which
    operation</em>, <em>which kind</em>. They are fitted offline with scikit-learn and shipped as a file of
    JSON weights; inference is a hand-written dot product over a list of floats, so the running assistant
    imports no machine-learning library at all.</p>
    <p>Retrieval over past commands is lexical arithmetic &mdash; word overlap and sequence similarity
    &mdash; not a vector search. The one embedding model, <code>nomic-embed-text</code> on the local
    Ollama, has a different job: it helps label an event or a task the keyword rules left blank, and
    when it cannot be reached the older word-feature classifier answers instead.</p>`
    },
    window: {
      view: "system", tag: "on the laptop", name: "window", rl: "the window", title: "The calendar window",
      z: [539, 169, 2.4],
      sum: `<p>The application you actually look at — calendar, tasks, timer, coursework. Everything the assistant can do, you can also do by hand here. <strong>It parses nothing.</strong></p>
    <p class="figs">both routes write through one path</p>`,
      more: `<p>Speaking is one way in. Everything the assistant creates can be created, edited and deleted
    here directly &mdash; type a title, drag an event to another hour, tick a task, set a repeat.</p>
    <p>Both routes meet at the same place. A typed event and a spoken one produce the same row, take the
    same field rules, and are edited the same way afterwards, because the screen and the assistant write
    through one path. It is also why a correction made by hand counts as feedback.</p>
    <p>Some things are screen-only by design. Speech suits &ldquo;book the dentist Thursday at four&rdquo;
    and not &ldquo;log the last forty minutes to the third project and split the session&rdquo;, so voice
    reaches the calendar and tasks fully, training partly, and the timer and coursework not at all.</p>
    <p>This window holds no parser. It once did, the two copies drifted, and every fix had to be written
    twice; it now posts text to the host exactly as a phone does.</p>`
    },
    hud: {
      view: "system", tag: "on the laptop", name: "panel", rl: "review panel", title: "The review panel",
      z: [560, 300, 2.2],
      sum: `<p>Every step the system took for a command, with its timings — so a wrong answer can be traced to the step that caused it rather than guessed at.</p>
    <p class="figs">floats over anything · works with the calendar closed</p>`,
      more: `<p>It is a separate application that <strong>talks to nothing</strong>. The brain appends one
    JSON line per step to a log file; this reads that file. Choosing a file over a connection buys three
    things at once: it floats above a full-screen app with the calendar shut, a command spoken to the phone
    shows up here without either device knowing about the other, and the log is the durable record its
    history view reads back.</p>
    <p>Above the live timeline it draws the brain's <em>chain</em> &mdash; the ordered steps this version
    of the brain is expected to take &mdash; and lights each slot done, active or skipped as the real steps
    arrive. The chain is keyed by a brain version stamped on every command, so an old trace still renders
    in the shape of the brain that produced it. A test fails the build if the drawn chain and the engine's
    actual stages stop agreeing.</p>
    <p>The history is searchable and filterable — by device, by kind, by outcome — and commands from
    scripts are labelled as such so they do not get mistaken for things you actually asked for.</p>`
    },
    tracelog: {
      view: "system", tag: "on disk", name: "trace log", rl: "trace log", title: "The trace log", z: [500, 436, 2.2],
      sum: `<p>One line of JSON per step, appended as the work happens. It is how the review panel knows
    anything, and the only record of <em>why</em> a command went the way it did.</p>
    <p class="figs">append-only &#183; survives a crash &#183; readable with any text editor</p>`,
      more: `<p>A finished run looks like this &mdash; one object, one command:</p>
    <pre><code>{"run": "run-8f3a",
 "source": "ios",
 "steps": [
  {"stage":"vocab",  "ms":2,   "ok":true},
  {"stage":"rule",   "ms":96,  "ok":true},
  {"stage":"execute","ms":11,  "ok":true},
  {"stage":"verify", "ms":6210,"ok":true}
 ],
 "result": {"message":"...","memory_id":417}}
</code></pre>
    <p>Two things follow from it being a file rather than a connection. The review panel can be closed,
    crashed or started late and still show the whole history, because the record is on disk and not in
    anyone's memory. And a command spoken to a phone appears on the host's screen without either device
    knowing the other exists &mdash; one writes, the other reads.</p>
    <p><code>source</code> is stamped on every run and defaults to <code>"test"</code> rather than to a
    real device, so a script that forgets to identify itself is filtered out of the history instead of
    quietly becoming part of what you appear to have asked for.</p>`
    },
    store: {
      view: "system", tag: "on disk", name: "database", rl: "the database", title: "One file on the disk",
      z: [297, 424, 2.3],
      sum: `<p>One SQLite file holds everything: events and tasks are two of its 23 tables, alongside timers, counters, courses, assignments and training plans.</p>
    <p class="figs">yours, on your machine · a repeat is ordinary rows sharing a series id</p>`,
      more: `<svg viewBox="0 0 380 208" role="img" aria-label="The twenty-one columns of one event row, grouped by what fills them: ten come from what you said, four the system decides, three are bookkeeping, and four exist only for syncing with a hosted calendar.">

    <text x="7" y="47" font-size="8.5">title</text><text x="52" y="47" font-size="8.5">date</text><text x="92" y="47" font-size="8.5">start_time</text>

  <rect x="0" y="80" width="184" height="40" rx="4" fill="none" stroke="var(--model)" stroke-width="1.2"/>
  <text x="7" y="93" font-size="8.5" fill="var(--model)">THE SYSTEM DECIDES — 4</text>
  <g font-size="8.5"><text x="7" y="110" font-size="8.5">category</text><text x="58" y="110" font-size="8.5">color</text><text x="90" y="110" font-size="8.5">series_id</text><text x="140" y="110" font-size="8.5">reminder</text></g>
  <rect x="196" y="80" width="184" height="40" rx="4" fill="none" stroke="var(--line)" stroke-width="1.2"/>

  <g font-size="8.5"><text x="203" y="110" font-size="8.5">id</text><text x="222" y="110" font-size="8.5">created_at</text><text x="290" y="110" font-size="8.5">updated_at</text></g>
  <rect x="0" y="128" width="380" height="40" rx="4" fill="none" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="7" y="141" font-size="8.5" fill="var(--muted)">ONLY IF YOU CONNECT A HOSTED CALENDAR — 4</text>
  <g font-size="8.5" fill="var(--muted)">
    <text x="7" y="158" font-size="8.5">source</text><text x="52" y="158" font-size="8.5">external_id</text>
    <text x="124" y="158" font-size="8.5">external_source</text><text x="216" y="158" font-size="8.5">sync_dirty</text>
  </g>
  <text x="0" y="190" font-size="8.5" fill="var(--muted)">most of a row is empty most of the time — an event with no</text>
  <text x="0" y="202" font-size="8.5" fill="var(--muted)">guests, no place and no repeat leaves twelve columns blank</text>
</svg>
<figcaption>Understanding the sentence fills nine of the twenty-one columns. The rest is the system's own work.</figcaption>
    <p>Spoken aloud, <em>&ldquo;lunch with Sam on Thursday at one&rdquo;</em> fills nine of twenty-one:</p>
<pre><code>title       "Lunch with Sam"
date        "2026-09-10"
start_time  "13:00"
end_time    "14:00"    &lt;- assumed
category    "Social"   &lt;- inferred
color       "#c2708a"  &lt;- follows
attendees   ""
location    ""
recurrence  ""
series_id   NULL
</code></pre>
    <p>The end time is a default and the two below it are the system classifying its own record so the
    calendar can colour it. A task is the same idea across 17 columns, six of them yours.</p>
    <p>A repeating event is stored as ordinary rows sharing a series id, so every query stays a plain date
    lookup and a day that should be skipped is simply never written. A task carries its count in one
    column &mdash; never as several identical rows, which would make it impossible to tell which one you
    ticked.</p>`
    },
    learn: {
      view: "system", tag: "after the answer", name: "remember", rl: "remember", title: "Remembered, not retrained",
      z: [407, 424, 2.3],
      sum: `<p>Every command is kept with what it produced and what you made of it. The model itself never changes — and right now the memory informs the person, not the prompt.</p>
    <p class="figs">retrieval ships off &mdash; measured, not assumed</p>`,
      more: `<p>Most verdicts are given by doing rather than pressing. Deleting something the assistant made
    counts as a rejection; editing it counts as a correction, with the fields you changed merged in to form
    what the parse should have produced.</p>
    <p>The strongest signal is the retry. A command that is deleted and immediately said again in different
    words has already been corrected &mdash; the second version is what the first one meant. Those pairs
    are found automatically, and checked before they are believed: the timing and wording must fit, and the
    model is asked whether it really was a retry rather than two things you both wanted.</p>
    <p>Pasting the four closest past commands into the prompt was measured on both brains, and they
    disagreed: the old whole-sentence parser gained from its own history, and the engine, which prompts per
    item, lost badly &mdash; whole-command examples shown against a short fragment teach the model the
    wrong shape of answer. So retrieval ships off: an evidence-backed zero rather than a missing feature,
    and if it returns it must be shaped per item first.</p>
    <p>Retrieval, when it is on, is lexical: word overlap and sequence similarity over the most recent
    commands. No vectors, no index to rebuild.</p>`
    },
    batch: {
      view: "system", tag: "more than one at a time", name: "several", rl: "several at once",
      title: "Several things at once", z: [420, 300, 1.6],
      sum: `<p>One recording becomes one transcript, and a transcript can describe several records &mdash; events, tasks, or a mixture. What differs is who works it out.</p>
    <p class="figs">each record is created, checked and remembered on its own</p>`,
      more: `<h3>Three different kinds of &ldquo;several&rdquo;</h3>
    <ul>
      <li><strong>Several commands.</strong> A phone can send them bracketed &mdash;
      <code>[gym tomorrow at 7am] [call the dentist at four]</code> &mdash; and they are pulled apart
      before parsing starts, each running on its own. Brackets were chosen because &ldquo;and&rdquo; was
      not available: it already means something inside a command.</li>
      <li><strong>Several asks in one sentence.</strong> That is the atomizer's job, and the whole reason
      the deep track exists.</li>
      <li><strong>Several items in one ask.</strong> &ldquo;Buy milk and bread&rdquo; stays ONE action with
      two titles. The split happens inside that action's own field by a small set of string rules: commas
      always separate; &ldquo;and&rdquo; separates unless a preposition just before it already opened the
      phrase the conjunction is joining (&ldquo;a gift for mum and dad&rdquo; is one errand), or the pair
      is a known idiom (&ldquo;fish and chips&rdquo;). The verb of the first item is shared across the
      rest, so the second reads &ldquo;buy bread&rdquo; rather than the bare word. Either list is capped at
      ten items.</li>
    </ul>
    <p>The model does the equivalent job on its own path by instruction rather than by code: told
    explicitly, in its prompt, to emit one title per item and never invent a collective one. The rule path
    enforces this structurally; the model path relies on following the rule it was given.</p>
    <p>The replies join into one answer: named while there are few, counted past three. If the third of
    four fails, the first two stand and the fourth is still attempted.</p>`
    },
    queue: {
      view: "system", tag: "speaking to nothing", name: "host away", rl: "host away",
      title: "When the host is away", z: [683, 368, 2.4],
      sum: `<p>Three queues, at two different points. A device holds what it cannot send; the host holds what it cannot yet understand.</p>
    <p class="figs">sound is kept &#183; meaning is decided later</p>`,
      more: `<div class="tblwrap"><table>
      <thead><tr><th>Queue</th><th>Holds</th><th>Drains when</th></tr></thead>
      <tbody>
        <tr><td>on a device</td><td>the recording you spoke</td><td>the host answers again</td></tr>
        <tr><td>on a device</td><td>edits made while away</td><td>the host answers again</td></tr>
        <tr><td>on the host</td><td>a transcript it could not parse</td><td>the language model is back</td></tr>
      </tbody>
    </table></div>
    <p>The third is the one people do not expect. A command can arrive perfectly well while the language
    model is down, so the transcript is parked and retried. It is a different failure from the phone being
    unable to reach the host, and it is handled in a different place.</p>
    <p>What a device stores is the sound, not a decision. The command is understood when it finally runs,
    against the calendar as it is then &mdash; an instruction is a thing you meant, not a diff computed an
    hour ago.</p>
    <p>Draining the edit queue has three outcomes: the host is away again, so everything is kept; the
    record changed meanwhile, so the host's version stands and you are told; or the change no longer
    applies, so it is dropped and the rest of the queue moves.</p>`
    },
    link: {
      view: "system", tag: "between the machines", name: "the link", rl: "the link", title: "One field of difference",
      z: [681, 314, 2.6],
      sum: `<p>Every surface posts what you said to the same brain over a private link between machines you own — no server in between. One field says which spoke.</p>
    <p class="figs">"mac" or "ios" — the entire difference</p>`,
      more: `<p>A surface reaches the host over a private mesh VPN: the machines address each other directly,
    wherever they are, and nothing is relayed through a company. It is the one kind of network hop in the
    system, and it is always between devices you own.</p>
    <p>What crosses it is a sentence and a reply — never a decision. The phone does not send &ldquo;create
    an event on Thursday&rdquo;; it sends what you said and renders what came back. That is why the same
    command behaves identically on every surface, and why a fix lands in one place.</p>
    <p>The <code>source</code> field labels the trace, the vocabulary corrections and the command history.
    It defaults to <code>"test"</code> rather than to a real device — so a script that forgets to identify
    itself is harmless, and a real client that forgets is obvious.</p>`
    },
    phone: {
      view: "system", tag: "the thin surfaces", name: "surfaces", rl: "the surfaces", title: "Any number of screens",
      z: [862, 320, 1.9],
      sum: `<p>Every attached surface is the same thin idea: a mic, a screen, a full local copy, a queue — and no parser. Add one with <strong>+</strong> and the brain does not change: a new device is a new <code>source</code> label, not new understanding.</p>
    <p class="figs">works with the host off · edits quote the version they were made against</p>`,
      more: `<p>Every surface is the same idea: record, send, render. The parsing happens once, on the host.</p>
    <svg viewBox="0 0 380 250" role="img" aria-label="The round trip. The phone records audio and sends it over the private link to the brain, which transcribes, understands, executes and writes one file. Changing that file changes its timestamp, and both the laptop window and the phone are watching it.">

    engine: {

      z: [620, 264, 1.2],
      sum: `<p><code>Engine</code> is the brain as an object. It builds the shared state, runs the transcript stage, picks a track, commits, labels, and does the bookkeeping. <strong>It adds structure, never logic</strong> — the parsing lives in the stages.</p>
    <p class="figs">engine/__init__.py · intake · track selection · commit · bookkeeping</p>`,
      more: `<h3>What it owns</h3>
    <ul>
      <li><strong>Serialization.</strong> A process-wide lock: one command at a time, first in first out,
      so two requests cannot race each other's context. The wait shows honestly in the trace total rather
      than being hidden.</li>
      <li><strong>Coalescing.</strong> Queued inputs can be merged into one batch under a token budget,
      which the segment stage then splits apart again deterministically. Overflow runs one at a time.</li>
      <li><strong>Track selection.</strong> It asks FastRule about the whole command. Commit &rarr;
      execute, label, and verify in the background. Defer &rarr; the deep system.</li>
      <li><strong>Two gates before commit, both the same shape.</strong> Doubted words from the transcript
      stage, and an interrogative create from the field rules: in both cases the parse is finished and
      <em>nothing is written</em> — the client is asked first.</li>
      <li><strong>Offline queueing.</strong> When a stage reports the model unreachable, the command is
      parked with an honest message rather than half-done.</li>
    </ul>
    <p>It also folds duplicate apologies: a loop-back re-runs a stage, and saying &ldquo;I couldn't read
    this part&rdquo; three times is one apology and two bugs.</p>`

    <figcaption>Five narrowings, in that order &mdash; and one thing deliberately NOT narrowed: the courtesy wrapper stays on, because FastRule's interrogative gate reads those words to tell a question from a polite imperative. An ignored false start is the one outcome with no trace at all: it is not remembered, because a run of them would teach the memory that false starts are normal.</figcaption>
    <h3>In order</h3>
    <ol>
      <li><strong>Stop keyword.</strong> The configured phrase that ends dictation is cut off the end.</li>
      <li><strong>The false-start filter.</strong> An acknowledgement, a stop word said alone, a syllable
      abandoned: anything with fewer than two meaningful words is <em>ignored</em> — not parsed, not
      executed, and above all <strong>not remembered</strong>. That last one is the point: the memory feeds
      examples of how you speak, and a run of false starts teaches it that false starts are normal.</li>
      <li><strong>Spoken noise.</strong> The openers that announce speech rather than a request, a trailing
      &ldquo;or something&rdquo;, a mid-sentence self-correction &mdash; and two more a real speaker
      produces constantly: an interrupting <em>filler phrase</em> (&ldquo;can you, you know, remind
      me&hellip;&rdquo;) and a <em>stutter</em>, the same word said twice, which the speech model writes
      down faithfully. Order matters between those two: &ldquo;you you know&rdquo; is <em>you</em> followed
      by the filler, not a stutter, so collapsing first leaves a stray &ldquo;know&rdquo; in front of the
      command. Two more came from real speech: a trailing <em>interjection</em> said to nobody after the
      command (&ldquo;&hellip;at 6.30. excuse me. excuse me.&rdquo;), and a one-word swap
      (&ldquo;with Pelic sorry, I mean Edo&rdquo;), a self-correction too short for the clause rule.
      The filler list also knows hold-on chatter (&ldquo;one moment, bear with me,&rdquo;), which used
      to cut a command into three asks by the commas it left behind. The <em>courtesy</em> wrapper is the one
      thing deliberately left alone &mdash; <code>drop_courtesy=False</code> &mdash; because FastRule's
      interrogative gate has to read those words to tell &ldquo;should I add yoga?&rdquo; from
      &ldquo;can you add yoga?&rdquo;. It comes off inside the parse instead.</li>
      <li><strong>The personal vocabulary.</strong> Confident fixes applied, with phonetic matching; a word
      can also expand shorthand or carry a label the rest of the system uses. Fuzzy matching never touches
      a list of protected everyday words, so a name can never swallow the word <em>data</em>.
      <br><strong>And the window is not fixed to the term&rsquo;s length</strong>, because the speech model
      does not keep a phrase&rsquo;s word boundaries when it mishears it: <em>quinoa delivery</em> comes
      back as four tokens, <em>ice cream</em> as one. Windows run from two words wider than the term down
      to one, widest first, and the two sides are compared with the spaces stripped out &mdash; the spaces
      are part of the damage, not evidence. A window of entirely ordinary words is never merged, which is
      what keeps a real phrase from being &ldquo;repaired&rdquo; into a term it merely resembles.</li>
      <li><strong>The command frame.</strong> The fixed phrases the routing reads
      &mdash; &ldquo;remind me to&rdquo; and its kin &mdash; put back when the
      speech model mangles them (&ldquo;rewind me to&rdquo;, &ldquo;remind mitt
      to&rdquo;). <em>Generic</em>, not personal: everyone says these, so a
      damaged one is misrouted for everyone. The guard is the whole three-word
      shape plus what follows it, because &ldquo;rewind&rdquo; is an ordinary
      word &mdash; &ldquo;rewind me to <em>call the plumber</em>&rdquo; is
      repaired, &ldquo;rewind me to <em>the start</em>&rdquo; is not.</li>
      <li><strong>The doubt gate.</strong> With the setting on and a client that says it can show an
      editor, doubtful words stop execution and ask you to check the transcription first.</li>
    </ol>
    <div class="ingest-demo" id="ingestDemo">
      <p class="demo-lead"><strong>Step it through.</strong> Pick a line and walk the passes.
      Nothing here is re-implemented &mdash; each step is what the real engine produced, recorded by

      <em>barista&nbsp;course</em>, <em>kombucha&nbsp;order</em> and <em>sudoku&nbsp;club</em> is loaded.</p>
      <div class="demo-pick" role="tablist" aria-label="Example transcripts"></div>
      <div class="demo-stage">

        <button type="button" class="demo-prev" aria-label="Previous pass">&#8592;</button>

        <button type="button" class="demo-next" aria-label="Next pass">&#8594;</button>
        <button type="button" class="demo-play">Play</button>
      </div>
    </div>
    <p>A word you change in that editor is learned as an alias; a resubmit you left untouched counts as a
    confirmation, and after two confirmations the word is whitelisted and never asked about again. The
    counters live beside the vocabulary, never inside it — the word list is hand-curated and writing
    machine counters into it would quietly degrade it.</p>
    <p>Why the cleanup is here and not further in: it used to live inside FastRule's own normalisation, so
    the deep track never got it, and a review of real usage found the model path failing every rambling
    dictation that opened with exactly those words.</p>`
    },

    <figcaption>Seven phases, and the worked example under them is the whole point: every arrow is arithmetic on the words. The bar at 0.80 is the front door's; this parse clears it because all four slots filled from what was actually said.</figcaption>
    <p><strong>Normalize.</strong> Dictation shorthand expands first (<code>mtg</code>, <code>w/</code>,
    <code>tmrw</code>, a bare weekday abbreviation), then spoken times, then a lead-time clause is lifted

    <p><strong>Route.</strong> An 84-entry table keyed on <code>(verb, domain)</code> pairs picks the
    action — a domain-specific entry wins when one exists, otherwise the verb falls back to what it means
    everywhere:</p>
    <pre><code>("remove", "calendar")  &#8594; delete_event
("add",    "todo")      &#8594; create_todo
("buy",    None)        &#8594; create_todo   # buying is always a task
</code></pre>
    <p>Where that table finds nothing at all, the trained operation and kind classifiers may compose an
    action between them — and only then, and only when both are decisive. A model-routed action is an
    inference and is billed like one: it goes through the guessed-domain penalty below, so the threshold
    still guards the commit.</p>
    <p><strong>Fill slots.</strong> Dates and times go through a dedicated recognizer with regex fallbacks
    for what it misses; a title is picked from the sentence's own noun chunks, with every temporal word
    carved out first so a time is never mistaken for part of a title. Which slots count as required depends
    on the action: creating an event needs a title, a date and a start time, while deleting one is
    satisfied by naming the event <em>or</em> giving the time that pins it down.</p>

    doubts. Each is a named signal, and every one is a multiplier:</p>

    <p>A command can be more than one span. Each span is scored on its own and the command takes the

    <h3>The honest-failure ladder</h3>
    <p>When a piece cannot be read cleanly, the system does not invent one:</p>

    <figcaption>Small local models quote far more reliably than they judge, so the check is built from the job they are good at. Asked whether an object is <em>correct</em>, an 8B says yes; asked which of your words produced its title, it either points at them or admits it cannot.</figcaption>
    <p>The date and the time never reach the model at all. A calendar object is stamped with today&rsquo;s date
    the moment it exists, so asking whether the words support it would flag every correct event that happens
    to be today &mdash; the honest record is what the stage before resolved, and that is read directly.</p>
    <p>Only faults in the <em>subject</em> earn a retry: a title the words do not establish, one calendar
    event whose words list three or more things, or one object whose own words still hold an ask seam
    (&ldquo;and then&rdquo;, &ldquo;. Also,&rdquo;). The rewrite has two tiers. First, code: the failed asks in
    the speaker&rsquo;s own words, or one clause per listed thing. Then, only when code has nothing new to say,
    the model &mdash; shown every earlier attempt and what the judge found wrong with it &mdash; writes the
    remaining asks as a list, one thing per line with its time at the end, and code joins them so the split
    is decided before segmentation reads a word. Both tiers are held to the transcript: a line that uses a
    word the speaker never said is refused whole. A rewrite cannot invent a time nobody said, so that fault
    commits with a note instead of looping; an object nothing asked for is not made real by parsing it
    again. This is what stops a command spending thirty seconds re-reading itself to the same answer.</p>
    <p>When the rounds run out and the subject still names nothing &mdash; &ldquo;this on my calendar&rdquo;,
    &ldquo;note of it&rdquo;, &ldquo;new list&rdquo; &mdash; the entry is <em>held back</em> rather
    than written, and the reply says which one and why. A bare <em>kind</em> of thing &mdash; &ldquo;event&rdquo;,
    &ldquo;appointment&rdquo;, &ldquo;date&rdquo; &mdash; is not held back: it goes in with its day and clock and the
    phone shows a one-line hint, once, because a wrong name at the right time is one tap to fix. A title that is specific but unsupported still goes in
    with its note: a wrong name is one tap to fix, a missing event is not.</p>
    <p>Behind a fast answer the same check runs as a verifier, and its patches are <em>tiered</em>: renaming
    a placeholder title is applied silently, while removing something you can see is proposed rather than
    done. Measured caution &mdash; an earlier always-on checker proposed dozens of changes and fixed none of
    them. When a removal <em>is</em> applied, the row is captured first so one tap puts it back.</p>`
    },

    <figcaption>The write and the label are one step, which is what makes the middle column matter: a category is a choice, a tag set is a set, and the difference is not cosmetic. Nothing here guesses &mdash; an item it cannot place is refused where you can see it.</figcaption>
    <h3>The label is written with the row, not after it</h3>
    <p>An <strong>event</strong> gets one of thirteen categories and the colour that goes with it; a
    <strong>task</strong> gets a set of tags. Both are decided in the same step as the write, so a row is
    never saved uncategorised &mdash; there is no window in which one exists without its label.</p>
    <p>The two are different problems, which is why they have different machinery. A category is a single
    choice out of thirteen. Tags are a <em>set</em>: a task can be groceries and an errand at once, and
    answering with only the strongest one would quietly drop the other.</p>
    <p>Both are keyword scoring today, and both are getting a learned classifier &mdash; measured, and
    shipped behind a switch that is off by default. The models do not replace the rules: a keyword match is
    nearly always right when it fires and rarely fires, so the rules answer first and keep that precision,
    and the model only fills a row they had no opinion about. On vocabulary the training never saw, the
    learned event classifier reads 49% against the rules&rsquo; 33%; across six synthetic speakers it is
    roughly three times more even-handed than the keyword lists, which serve whoever wrote them best.</p>
    <p>Nothing about a person&rsquo;s corrections leaves their machine. The shipped model is fitted on
    generated vocabulary belonging to nobody; a second, personal one is fitted on top of it from the labels
    that person has actually changed &mdash; and only the ones they changed, because a label nobody
    objected to is not agreement, and training on it would teach the model its own output.</p>
    <h3>Three honest outcomes it will not paper over</h3>
    <ul>
      <li>A <strong>blocked</strong> item — one the observance gate refused — is reported with its reason,
      never silently dropped.</li>
      <li>An <strong>unknown</strong> parse produces &ldquo;I didn't understand&rdquo;, not a guess.</li>
      <li>A <strong>target that cannot be found</strong> produces &ldquo;I couldn't find…&rdquo;. Deleting
      is destructive: when the engine cannot identify what to delete, empty hands are the right answer and
      guessing is not.</li>
    </ul>
    <p>It also records what actually ran, per item — which kind, which row, which action, in which position
    — because that record is what the command memory and the later corrected-or-rejected hooks read.</p>`

    <h3>The one that is hardest, and why it is a parse</h3>
    <p>Splitting on where the conjunctions fall cannot tell &ldquo;meeting with Tal and Sam&rdquo; from
    &ldquo;book the gym and remind me to buy milk&rdquo;. The dependency parse can: the second half is
    marked as a conjunct, and what got coordinated says which kind of join it is. A verb conjunct that
    carries its own object, joined to a head that carries its own, is a second ask; a shared object
    (&ldquo;wash and fold the laundry&rdquo;) is one.</p>
    <p>It is honest about failure: if the grammar model is unavailable or the parse is degenerate it reports
    <em>no</em> clause coordination, so the regexes stay the floor and an outage can never make the system
    over-refuse.</p>
    <p>And it is cheap because of one observation: a conjunct needs a coordinator, so a sentence without one
    cannot have clause coordination and never needed parsing. Well over half of the two evaluation sets'
    utterances match nothing and skip the parse entirely, which brought the fast track's tail latency
    back below where it sat before the feature landed.</p>`

    <p>Hand-writing thousands of realistic commands is either extremely slow or extremely repetitive. So the

    <p>What that buys, which no amount of real data does, is supervision on <em>structure</em>: whether each

    personaset: {
      view: "eval", tag: "the data", name: "personas", rl: "personas", title: "Six invented speakers",
      z: [745, 344, 2.0],
      sum: `<p>Six synthetic users, each with its own vocabulary <em>and</em> its own way of speaking, 2,520 rows, and <strong>every single row is test-only, forever</strong>.</p>
    <p class="figs">a set you have optimised against cannot answer this question</p>`,
      more: `<p>They exist to answer something no other dataset here can: does this work for people other than

    prompt — not the ones that pass, not the ones that fail. A persona number may be reported; it may not

    <h3>What makes the comparison mean anything</h3>
    <p>A shared catalogue defines each ask by its <em>grammar</em> — how many asks, which action, which
    slots — rather than by its words, and every persona realises every structure in its own voice. The build
    fails if a persona's template produces a different slot set from the one its structure declares. So the
    structural composition is identical by construction, and the board can report both a natural mix
    (product-realistic) and a structure-matched one (the clean comparison).</p>
    <p>The set includes deliberate decoys that must <em>not</em> split — &ldquo;X with A and B&rdquo;,
    &ldquo;buy A and B&rdquo; — alongside compounds in every type-order, a disfluent ramble, and the
    question-shaped ask that should be offered rather than executed.</p>
    <h3>Two things about the data itself</h3>
    <p>Every name, place and activity is invented, and the build runs a leak gate against the real personal
    word list, failing if any word of it appears in a generated row. The control persona shares the author's

    <p>And a persona is a <strong>day-one user with no personal configuration</strong>: the two features

<script>
/* THE STAGE DEMOS. Every widget below replays a RECORDING made by
   scripts/gen_explorer_demos.py from the real code — segmentation's cut, the
   resolver's values, the front door's verdict, the whole chain's X0..X4 and
   trace — for invented commands. The page runs no engine of its own, for the
   reason gen_ingest_demo.py gives: a second implementation drifts and nobody
   notices. test_artifact_claims regenerates the model-free islands and fails
   if the page's copy differs. */
(function () {
  const island = document.getElementById("explorer-demos");
  if (!island) return;
  let D;
  try { D = JSON.parse(island.textContent); } catch (e) { return; }
  const esc = t => String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  function picker(host, items, labelOf, onPick) {
    const row = el("div", "pick"); row.setAttribute("role", "tablist");
    items.forEach((it, k) => {
      const b = el("button", null, esc(labelOf(it))); b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", k === 0 ? "true" : "false");
      b.addEventListener("click", () => { row.querySelectorAll("button").forEach(x => x.setAttribute("aria-selected", "false")); b.setAttribute("aria-selected", "true"); onPick(it, k); });
      row.appendChild(b);
    });
    host.appendChild(row);
    return row;
  }
  function markSpans(text, spans) {
    // highlight [start,end) spans in the command; spans sorted, non-overlapping
    const ss = (spans || []).slice().sort((a, b) => a.start - b.start);
    let out = "", i = 0;
    ss.forEach(sp => { if (sp.start < i) return; out += esc(text.slice(i, sp.start)) + "<mark title='" + esc(sp.kind) + "'>" + esc(text.slice(sp.start, sp.end)) + "</mark>"; i = sp.end; });
    return out + esc(text.slice(i));
  }

  /* --- segmentation: the cut, the time each piece owns, its kind --- */
  function segDemo(host) {
    if (!D.seg || !D.seg.length) return;
    const box = el("div", "sdemo"); box.appendChild(el("h4", null, "Cut it yourself — pick a command"));
    box.appendChild(el("p", "lead", "The time phrases the reader found are marked in the command; below it, the pieces the cut produced, each with the time it OWNS and the kind it was tagged. Recorded from <code>fastseg</code>."));
    const cmd = el("div", "cmd"), pieces = el("div", "pieces");
    function show(ex) {
      cmd.innerHTML = markSpans(ex.text, ex.refs);
      pieces.innerHTML = "";
      ex.items.forEach(it => {
        const p = el("div", "piece", "<b>" + esc(it.action) + "</b><span class='t'>" + esc(it.time || "(no time — today)") + "</span><br><span class='k " + esc(it.tag) + "'>" + esc(it.tag) + "</span>");
        pieces.appendChild(p);
      });
    }
    picker(box, D.seg, e => e.label, show); box.appendChild(cmd); box.appendChild(pieces); show(D.seg[0]); host.appendChild(box);
  }

  /* --- decompose_validate: a phrase in, values out --- */
  function resolveDemo(host) {
    if (!D.resolve || !D.resolve.length) return;
    const box = el("div", "sdemo"); box.appendChild(el("h4", null, "A time phrase in, every value out"));
    box.appendChild(el("p", "lead", "Recorded from <code>resolve.resolve</code> on " + esc((D.clock || "").slice(0, 10)) + ", a Wednesday. The conventions are the ones the stage's table states — a bare 7 is the evening, a bare 11 the morning, a compact 910am is 09:10."));
    const tbl = el("table", "vals");
    function show(r) {
      const v = r.values || {};
      const rows = [["date", v.date], ["start", v.start_time], ["end", v.end_time], ["recurrence", v.recurrence], ["on days", (v.recur_days || []).join(", ")], ["until", v.recur_until]];
      tbl.innerHTML = rows.filter(x => x[1]).map(x => "<tr><td>" + esc(x[0]) + "</td><td><b>" + esc(x[1]) + "</b></td></tr>").join("") || "<tr><td colspan=2>no value — the phrase names no day and no clock</td></tr>";
    }
    picker(box, D.resolve, r => r.phrase, show); box.appendChild(tbl); show(D.resolve[0]); host.appendChild(box);
  }

  /* --- FastRule: handled, deferred or refused --- */
  function fastruleDemo(host) {
    if (!D.fastrule || !D.fastrule.length) return;
    const box = el("div", "sdemo"); box.appendChild(el("h4", null, "The front door's verdict"));
    box.appendChild(el("p", "lead", "Handled means committed on the fast track; deferred means handed up to the deep track with a reason; refused means a correct reading that must not execute as stated. Recorded from <code>FastRule.run</code>."));
    const cmd = el("div", "cmd"), verdict = el("div"), objs = el("div", "pieces");
    function show(f) {
      cmd.textContent = f.text;
      verdict.innerHTML = "<span class='verdict " + esc(f.class) + "'>" + esc(f.class) + (f.reason ? " · " + esc(f.reason) : "") + "</span> <span class='lead'>confidence " + esc(f.confidence) + "</span>";
      objs.innerHTML = "";
      (f.objects || []).forEach(o => objs.appendChild(el("div", "piece", "<b>" + esc(o.action) + "</b><span class='t'>" + esc(o.title || "(no title)") + "</span><br><span class='t'>" + esc([o.date, o.start_time, o.end_time].filter(Boolean).join(" · ")) + "</span>")));
      if (!(f.objects || []).length) objs.appendChild(el("div", "piece", "<span class='t'>nothing built here</span>"));
    }
    picker(box, D.fastrule, f => f.label, show); box.appendChild(cmd); box.appendChild(verdict); box.appendChild(objs); show(D.fastrule[0]); host.appendChild(box);
  }

  /* --- the whole chain: X0..X4, the trace, and the diagram lit up --- */
  const STAGE_FOR_BOUND = { X0: "ingest", X1: "ingest", X2: "segmentation", X3: "decompose_validate", X4: "fastrule" };
  const STAGE_FOR_STEP = { vocab: "ingest", rule: "fastrule", validate: "decompose_validate", llm: "llmjudge", verify: "llmjudge", execute: "commit_label", done: "commit_label" };
  function light(stageName) {
    const svg = document.getElementById("view-engine"); if (!svg) return;
    svg.querySelectorAll("[data-stage].demo-lit").forEach(e => e.classList.remove("demo-lit", "sel"));
    if (!stageName) return;
    svg.querySelectorAll('[data-stage="' + stageName + '"]').forEach(e => e.classList.add("demo-lit", "sel"));
  }
  function chainDemo(host, judgeOnly) {
    if (!D.chain || !D.chain.length) return;
    const box = el("div", "sdemo");
    box.appendChild(el("h4", null, judgeOnly ? "Watch the judge work — pick a command" : "Run a command through the chain"));
    box.appendChild(el("p", "lead", judgeOnly ? "The trace from the judge onward: findings, the loop-back with its rewritten command, what was held back and why. Recorded with the model on." : "Step through what each stage handed the next (X0 to X4) and the trace the panel would draw; the diagram lights the stage you are on. Recorded with the model on, so the deep rows show the rescue at work."));
    const cmd = el("div", "cmd"), bounds = el("div", "bounds"), steps = el("ul", "steps"), reply = el("div", "reply"), ctl = el("div", "ctl");
    let cur = null, k = 0, rows = [];
    function rowsOf(c) {
      const out = [];
      if (!judgeOnly) (c.boundaries || []).forEach(b => out.push({ kind: "bound", name: b.name, value: b.value, stage: STAGE_FOR_BOUND[b.name] }));
      (c.steps || []).forEach(s => { if (judgeOnly && !(s.stage === "verify" || s.stage === "llm" || s.outcome || s.stage === "execute")) return; out.push({ kind: "step", stage: s.stage, title: s.title, detail: s.detail, ok: s.ok, outcome: s.outcome, light: STAGE_FOR_STEP[s.stage] }); });
      return out;
    }
    function draw() {
      bounds.innerHTML = ""; steps.innerHTML = "";
      rows.forEach((r, i) => {
        if (r.kind === "bound") bounds.appendChild(el("div", "bound" + (i === k ? " cur" : ""), "<span class='x'>" + esc(r.name) + "</span><span class='v'>" + esc(r.value) + "</span>"));
        else steps.appendChild(el("li", (r.ok ? "" : "bad") + (i === k ? " cur" : ""), "<span class='st'>" + esc(r.stage) + "</span><span><b>" + esc(r.title) + "</b>" + (r.outcome ? " <em>(" + esc(r.outcome.replace("_", " ")) + ")</em>" : "") + " — " + esc(r.detail) + "</span>"));
      });
      const r = rows[k]; light(r ? (r.kind === "bound" ? r.stage : r.light) : null);
      ctl.querySelector(".n").textContent = (k + 1) + " / " + rows.length;
    }
    function show(c) { cur = c; rows = rowsOf(c); k = 0; cmd.textContent = c.text; reply.innerHTML = "<b>reply:</b> " + esc(c.message) + (c.hint ? " · <em>hint: " + esc(c.hint.replace("_", " ")) + "</em>" : "") + " · <em>" + esc(c.parse) + " path</em>"; draw(); }
    picker(box, D.chain, c => c.label, show);
    box.appendChild(cmd); box.appendChild(bounds); box.appendChild(steps); box.appendChild(reply);
    ctl.innerHTML = "<button type='button' class='prev'>◀ back</button><button type='button' class='next'>step ▶</button><span class='n'></span>";
    ctl.querySelector(".prev").addEventListener("click", () => { k = Math.max(0, k - 1); draw(); });
    ctl.querySelector(".next").addEventListener("click", () => { k = Math.min(rows.length - 1, k + 1); draw(); });
    box.appendChild(ctl); show(D.chain[0]); host.appendChild(box);
  }

  /* --- the boards, as bars --- */
  function bars(host, title, series, unit) {
    const W = 360, H = 24 * series.length + 24, max = Math.max(100, ...series.map(s => s.v));
    let svg = "<svg class='chart' viewBox='0 0 " + W + " " + H + "' role='img' aria-label='" + esc(title) + "'>";
    series.forEach((s, i) => {
      const y = 6 + i * 24, w = Math.max(1, (W - 150) * s.v / max);
      svg += "<text x='0' y='" + (y + 11) + "'>" + esc(s.label) + "</text><rect class='bar " + (s.cls || "") + "' x='128' y='" + y + "' width='" + w + "' height='14' rx='2'/><text x='" + (132 + w) + "' y='" + (y + 11) + "'>" + esc(s.v) + esc(unit || "%") + "</text>";
    });
    svg += "</svg>";
    const box = el("div", "sdemo"); box.appendChild(el("h4", null, esc(title))); box.insertAdjacentHTML("beforeend", svg); host.appendChild(box);
  }
  function evalDemo(host, which) {
    const E = D.eval || {};
    if (which === "engine" && E.dev100 && E.dev100.length) {
      bars(host, "dev-100 count-correct, the last runs (train slice, 100 rows)", E.dev100.map(r => ({ label: "run " + r.run + " · " + r.date.slice(5), v: r.pct })));
      if (E.sealed) bars(host, "The TEST set (sealed 300), count-correct by system state", E.sealed.map(s => ({ label: s.state, v: s.pct, cls: /control/.test(s.state) ? "b" : "" })));
    }
    if (which === "real" && E.real_usage) {
      const R = E.real_usage, lab = { generic_title: "generic-title right (21 rows)", corrected_count: "corrected: count right", corrected_fields: "corrected: every reachable field", approved: "approved reproduced (17)" };
      bars(host, "Real usage on 2026-09-22 — start of the day vs end", Object.keys(R).flatMap(kk => [{ label: lab[kk] + " · before", v: R[kk][0], cls: "b" }, { label: lab[kk] + " · after", v: R[kk][1] }]));
    }
    if (which === "loop" && E.board_d) {
      const B = E.board_d;
      bars(host, "Board D v2 — the loop connected, " + B.n + " train rows", [{ label: "loop OFF", v: B.off, cls: "b" }, { label: "loop ON", v: B.on }]);
      const by = B.by_reentries || {};
      bars(host, "…by rounds the loop spent (correct, loop ON)", Object.keys(by).sort().map(r => ({ label: r + " round" + (r === "1" ? "" : "s") + " · n=" + by[r].n, v: by[r].n ? Math.round(1000 * by[r].on / by[r].n) / 10 : 0 })));
    }
  }

  /* --- mount by panel id when a panel opens --- */
  const MOUNTS = {
    segment: h => segDemo(h),
    decompose: h => resolveDemo(h), validate: h => resolveDemo(h),
    fastrule: h => fastruleDemo(h),
    crosscheck: h => chainDemo(h, true), generate: h => chainDemo(h, true),
    Engine: h => chainDemo(h, false),
    lvl1: h => evalDemo(h, "engine"), lvl5: h => evalDemo(h, "real"), measure: h => evalDemo(h, "loop"),
  };
  window.__mountDemo = function (id, host) {
    try { const f = MOUNTS[id]; if (f) f(host); } catch (e) { /* a widget must never break the panel */ }
  };
  window.__unlightDemo = function () { light(null); };
})();
